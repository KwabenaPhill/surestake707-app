<title>Sure Stake 707 Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo+Narrow:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow+Semi+Condensed:wght@400;600;700;800&family=Bebas+Neue&family=Changa:wght@400;600;700;800&family=DM+Sans:wght@400;600;700;800&family=Fjalla+One&family=Inter:wght@400;600;700;800&family=Kanit:wght@400;600;700;800&family=Lato:wght@400;700;900&family=League+Spartan:wght@400;600;700;800;900&family=Manrope:wght@400;600;700;800&family=Montserrat:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800&family=Open+Sans:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Rajdhani:wght@400;600;700&family=Raleway:wght@400;600;700;800&family=Roboto+Condensed:wght@400;700;900&family=Roboto+Slab:wght@400;600;700;800&family=Saira+Condensed:wght@400;600;700;800&family=Space+Grotesk:wght@400;600;700&family=Teko:wght@400;500;600;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--f:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--purple:#BF5AF2;--orange:#FF9F0A;--green:#30D158;--blue:#32ADE6;--yellow:#FFD60A;--red:#FF453A;--mute:#C9C9C9;--dim:#8A8A8A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{background:#000;color:#fff;font-family:var(--f);min-height:100%;max-width:480px;margin:0 auto;padding-bottom:96px}
.app-header{text-align:center;padding:20px 16px 6px}
.app-header .sub{font-size:10px;letter-spacing:4px;color:var(--mute);text-transform:uppercase;margin-bottom:2px}
.app-header h1{font-size:24px;font-weight:900;background:linear-gradient(135deg,#FFFFFF,#B0B0B0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.app-header .ver{font-size:11px;color:#666;font-weight:700;margin-left:5px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#0D0D0D;border-top:1px solid #333;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{position:relative;flex:1;padding:13px 4px 11px;background:none;border:none;color:var(--mute);font-size:10px;font-weight:700;cursor:pointer;font-family:var(--f);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .18s ease}
.nav-btn .ni{font-size:19px;transition:transform .18s ease}
.nav-btn::before{content:'';position:absolute;top:0;left:18%;right:18%;height:3px;background:var(--tab);border-radius:0 0 3px 3px;transform:scaleX(0);transition:transform .2s cubic-bezier(.3,.8,.3,1)}
.nav-btn.active::before{transform:scaleX(1)}.nav-btn.active{color:var(--tab)}.nav-btn.active .ni{transform:translateY(-1px) scale(1.12)}
.page{display:none;padding:12px 16px}.page.active{display:block;animation:pageIn .26s cubic-bezier(.22,.8,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.95);opacity:0}60%{transform:scale(1.015)}100%{transform:scale(1);opacity:1}}
@keyframes subIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
button{font-family:var(--f);transition:transform .12s cubic-bezier(.3,.8,.3,1),filter .16s ease;cursor:pointer;color:#fff}
button:active{transform:scale(.955);filter:brightness(1.12)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card{background:#161616;border-radius:16px;padding:16px 16px;margin-bottom:12px;border:1px solid #333;animation:cardIn .3s cubic-bezier(.22,.8,.3,1) both}
.card.tint{background:#1A0D2A;border-color:#3A2A4E}
.ct{font-size:15px;font-weight:900;margin-bottom:4px}.ct.p{color:var(--purple)}.ct.o{color:var(--orange)}.ct.g{color:var(--green)}.ct.b{color:var(--blue)}.ct.y{color:var(--yellow)}
.cs{font-size:13px;color:var(--dim);line-height:1.45;margin-bottom:12px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.summary-box{background:#161616;border-radius:14px;padding:12px 6px;border:1px solid #333;text-align:center;animation:cardIn .3s both}
.summary-box .bl{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.summary-box .bv{font-size:22px;font-weight:900}.summary-box .bs{font-size:10px;color:var(--dim);margin-top:3px}
.c-p{color:var(--purple)}.c-o{color:var(--orange)}.c-g{color:var(--green)}.c-b{color:var(--blue)}.c-y{color:var(--yellow)}.c-r{color:var(--red)}
.btn-save{flex:1;padding:14px;border-radius:12px;background:linear-gradient(135deg,#BF5AF2,#8E3FBE);border:none;color:#fff;font-size:14px;font-weight:800}
.btn-save.green{background:linear-gradient(135deg,#30D158,#28A745)}.btn-save.yellow{background:linear-gradient(135deg,#FFD60A,#E0A800);color:#1A1405}.btn-save.orange{background:linear-gradient(135deg,#FF9F0A,#D97E00)}
.btn-out{flex:1;padding:14px;border-radius:12px;background:#161616;border:1px solid #3A2A4E;color:var(--purple);font-size:14px;font-weight:800}
.btn-half{flex:1;padding:12px;border-radius:12px;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--mute);font-size:13px;font-weight:700}
.btn-half.blue{border-color:#1A3A5E;color:var(--blue)}.btn-half.green{border-color:#1E3A2A;color:var(--green)}.btn-half.orange{border-color:#3A2A1A;color:var(--orange)}.btn-half.purple{border-color:#3A2A4E;color:var(--purple)}.btn-half.yellow{border-color:#4A3F1A;color:var(--yellow)}.btn-half.red{border-color:#3A1A1A;color:var(--red)}
.btn-danger{width:100%;padding:13px 16px;border-radius:12px;background:#161616;border:1px solid #3A1A1A;color:var(--red);font-size:13px;font-weight:700}
.btn-row{display:flex;gap:8px;margin-top:10px}
.w100{width:100%}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;flex-wrap:wrap}.chips::-webkit-scrollbar{display:none}
.chips.scroll{flex-wrap:nowrap}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid #333;background:#161616;color:var(--mute)}
.chip.on{background:#1E1E1E;border-color:var(--c,var(--purple));color:var(--c,var(--purple))}
.lbl{font-size:11px;color:var(--mute);margin:12px 0 6px;display:block;font-weight:600}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;background:#101010;border:1px solid #2A2A2A;color:#fff;font-size:15px;font-family:var(--f)}
input:focus,textarea:focus{outline:none;border-color:var(--purple)}
textarea{resize:vertical;line-height:1.4;min-height:70px}
.muted{color:var(--dim);font-size:12.5px;line-height:1.45}
.link{background:none;border:none;color:var(--purple);font-weight:800;font-size:13px;padding:8px 0}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:14px 6px}
/* todo rows */
.todo{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #262626;animation:cardIn .3s both}
.todo:last-child{border-bottom:0}
.todo .ic{width:40px;height:40px;border-radius:12px;background:#1E1E1E;display:grid;place-items:center;font-size:19px;flex:none;overflow:hidden}
.todo .ic img{width:100%;height:100%;object-fit:cover}
.todo .tx{flex:1;min-width:0}
.todo .tt{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;text-align:left;width:100%}
.todo .tt .nx{font-size:9px;font-weight:800;letter-spacing:1px;color:#1A0D2A;background:var(--purple);padding:2px 6px;border-radius:99px}
.todo .pv{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini button{padding:7px 11px;border-radius:99px;font-size:12px;font-weight:800;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--mute)}
.mini button[data-p=tg]{border-color:#1A3A5E;color:var(--blue)}.mini button[data-p=wa]{border-color:#1E3A2A;color:var(--green)}.mini button[data-p=x]{border-color:#444;color:#fff}
.mini button[data-p=gpt],.mini button[data-p=gemini]{border-color:#3A2A4E;color:var(--purple)}
.mini button.done{background:#0F2A1A;border-color:#1E5A34;color:var(--green)}.mini button.done::before{content:'✓ '}
.res{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #262626}.res:last-child{border:0}
.res .n{flex:1;font-size:14px;font-weight:800}.res .n small{display:block;color:var(--dim);font-weight:600;font-size:12px}
.res button{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:800;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--mute)}
.res button.w{border-color:#1E3A2A;color:var(--green)}.res button.l{border-color:#3A1A1A;color:var(--red)}
.rem{display:flex;gap:10px;align-items:center;padding:9px 0;font-size:13.5px;border-bottom:1px solid #262626}.rem:last-child{border:0}
details.done-list summary{list-style:none;cursor:pointer;font-weight:800;font-size:14px;color:var(--green)}
details.done-list summary::-webkit-details-marker{display:none}
details.done-list .d{font-size:13px;color:var(--dim);padding:7px 0;border-bottom:1px solid #262626}
/* post card */
.post{background:#101010;border:1px solid #2A2A2A;border-radius:14px;padding:12px;margin-bottom:10px}
.post .ph{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;font-size:13.5px;font-weight:800}
.post .ph span{font-size:11px;color:var(--dim);font-weight:700}
.post pre{white-space:pre-wrap;word-break:break-word;font-family:var(--f);font-size:14px;line-height:1.45;background:#161616;border-radius:10px;padding:10px;max-height:300px;overflow:auto}
.post textarea{font-size:14px;min-height:110px;background:#161616}
.thumbs{display:flex;gap:6px;margin-top:8px;align-items:center}.thumbs img{width:38px;height:56px;object-fit:cover;border-radius:6px;border:1px solid #333}
.mimg{width:100%;border-radius:12px;display:block;margin-bottom:8px;border:1px solid #333}
.layouts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}.layouts button{width:34px;padding:7px 0;border-radius:9px;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--mute);font-weight:800;font-size:13px}
.layouts button.on{border-color:var(--yellow);color:var(--yellow)}
/* codes */
.code{display:grid;grid-template-columns:58px 1fr;gap:10px;background:#101010;border:1px solid #2A2A2A;border-radius:14px;padding:10px;margin-bottom:8px}
.slip{width:58px;height:86px;border-radius:9px;background:#1E1E1E;border:1px dashed #333;display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--dim);font-weight:700;padding:0}
.slip img{width:100%;height:100%;object-fit:cover}
.code .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:900;font-size:14px}
.code .ins{display:grid;grid-template-columns:1fr 84px;gap:6px}.code .ins input{padding:9px 10px;font-weight:700}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:800;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--dim)}
.seg button.on[data-v=pending]{border-color:#555;color:#fff}.seg button.on[data-v=won]{border-color:var(--green);color:var(--green);background:#0F2A1A}.seg button.on[data-v=lost]{border-color:var(--red);color:var(--red);background:#2A0F0F}
.pick{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #262626;font-size:13.5px}.pick:last-child{border:0}.pick span{flex:1}
.pick button{padding:7px 10px;border-radius:9px;background:#1E1E1E;border:1px solid #2A2A2A}
.pick button.on.w{border-color:var(--green);background:#0F2A1A}.pick button.on.x{border-color:var(--red);background:#2A0F0F}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daybar strong{font-size:17px;font-weight:900}.daybar button{width:42px;height:38px;border-radius:10px;background:#161616;border:1px solid #333;font-size:18px}
/* history */
.hrow{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #262626;padding:11px 0}.hrow:last-child{border:0}
.hrow .a{display:flex;justify-content:space-between;font-size:14px;font-weight:800}.hrow .a span{font-size:11.5px;color:var(--dim)}
.hrow .b{font-size:12.5px;color:var(--dim);margin-top:3px}
.fol{width:100%;border-collapse:collapse;font-size:12.5px}.fol th,.fol td{padding:7px 3px;text-align:right;border-bottom:1px solid #262626}.fol th{color:var(--dim);font-weight:700}
.fol th:first-child,.fol td:first-child{text-align:left}.fol small{display:block;font-size:10px}.up{color:var(--green)}.down{color:var(--red)}
/* elite */
.mem{padding:12px 0;border-bottom:1px solid #262626}.mem:last-child{border:0}
.mem .t{display:flex;justify-content:space-between;align-items:center;gap:8px}.mem .t strong{font-size:15px}
.tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid}
.tag.ok{color:var(--green);border-color:#1E5A34}.tag.due{color:var(--yellow);border-color:#5A4A1A}.tag.exp{color:var(--red);border-color:#5A1E1E}
.mem .s{font-size:12.5px;color:var(--dim);margin-top:3px}.mem ul{margin:8px 0 0 18px;font-size:12.5px;color:var(--dim)}
.mem .btn-row button{padding:9px}
/* settings */
.set-group{margin-bottom:16px;animation:cardIn .3s both}
.set-title{font-size:10px;letter-spacing:2px;color:var(--dim);font-weight:800;margin:0 4px 8px;text-transform:uppercase}
.set-list{background:#161616;border:1px solid #333;border-radius:16px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid #262626;padding:13px 14px;text-align:left}
.set-row:last-child{border:0}.set-row:active{transform:none;background:#1C1C1C}
.set-row .i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:#1E1E1E;flex:none;overflow:hidden}.set-row .i img{width:100%;height:100%;object-fit:contain;background:#fff}
.set-row .t{flex:1;min-width:0;font-size:14px;font-weight:800}.set-row .t small{display:block;font-size:11.5px;color:var(--dim);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row .v{font-size:12.5px;color:var(--dim);font-weight:700}.set-row .ch{color:#555;font-size:20px}
/* video */
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:12px}
.screen{width:min(100%,calc(52vh * 9 / 16));aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;border:1px solid #333}
.screen canvas{width:100%;height:100%;display:block}
.rec.on{background:#fff!important;color:#C8102E!important}
.match{background:#101010;border:1px solid #2A2A2A;border-radius:14px;padding:10px;margin-bottom:10px}
.match.cur{border-color:var(--orange)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:800;color:var(--dim)}
.mhead button{background:none;border:0;color:var(--dim);font-size:12px;font-weight:700}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.crest{width:68px;height:68px;padding:6px;border-radius:12px;background:#fff;display:grid;place-items:center;color:#8A8A8A;font-size:28px;font-weight:700;overflow:hidden;border:0}
.crest img{width:100%;height:100%;object-fit:contain}
.side input{text-align:center;padding:10px 6px;font-weight:700}
.score{display:flex;align-items:center;gap:5px}.score input{width:48px;font-size:22px;font-weight:900;padding:6px 0;text-align:center}.score span{color:var(--dim);font-weight:900}
.tpls{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.tpls::-webkit-scrollbar{display:none}
.tpls button{flex:0 0 84px;padding:5px;border-radius:12px;background:#101010;border:1px solid #2A2A2A;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--mute)}
.tpls img,.tpls .add{width:100%;aspect-ratio:9/16;border-radius:8px;object-fit:cover;display:block}
.tpls .add{display:grid;place-items:center;border:1px dashed #444;font-size:24px;color:var(--dim)}
.tpls button.on{border-color:var(--orange);color:var(--orange)}
/* crest library */
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cgrid button{background:#161616;border:1px solid #2A2A2A;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cgrid .cb{width:44px;height:44px;background:#fff;border-radius:9px;display:grid;place-items:center;padding:3px}.cgrid .cb img{max-width:100%;max-height:100%}
.cgrid span{font-size:10px;color:var(--mute);width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cgrid button.dup{border-color:var(--orange)}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.igrid button{padding:0;border:1px solid #2A2A2A;border-radius:10px;overflow:hidden;background:#101010;aspect-ratio:1;position:relative}
.igrid img{width:100%;height:100%;object-fit:cover}.igrid .u{position:absolute;left:4px;bottom:4px;font-size:9.5px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:99px;color:var(--mute)}
/* layers */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#161616;border-radius:20px 20px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;border-top:1px solid #2A2A2A;max-height:90vh;overflow-y:auto;animation:popIn .24s cubic-bezier(.22,.8,.3,1) both}
.modal-title{font-size:16px;font-weight:900;margin-bottom:12px}
.sub{position:fixed;inset:0;background:#000;z-index:300;overflow-y:auto;display:none;padding-bottom:40px}
.sub.open{display:block;animation:subIn .24s cubic-bezier(.22,.8,.3,1) both}
.subhead{position:sticky;top:0;z-index:2;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid #222}
.subhead button{width:40px;height:40px;border-radius:12px;background:#161616;border:1px solid #333;font-size:20px}
.subhead h2{font-size:17px;font-weight:900;flex:1}
.subbody{max-width:480px;margin:0 auto;padding:12px 16px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#1E1E1E;border:1px solid #333;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:700;z-index:900;display:none;animation:popIn .26s cubic-bezier(.22,.8,.3,1) both;max-width:92vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.toast.on{display:block}
video.res-v{width:min(100%,calc(52vh * 9 / 16));aspect-ratio:9/16;display:block;margin:0 auto 12px;border-radius:12px;background:#000}

.ico{display:block;width:100%;height:100%}.ico svg{width:100%;height:100%;display:block}
.todo .ic{background:none;position:relative;overflow:visible}
.todo .ic .main{width:40px;height:40px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#1E1E1E}
.todo .ic .bdg{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:#161616;border:2px solid #161616;display:grid;place-items:center;font-size:10px;overflow:hidden}
.bi{width:15px;height:15px;display:inline-block;vertical-align:-3px;margin-right:6px;flex:none}.bi svg{width:100%;height:100%;display:block}
.summary-box.sw{cursor:pointer;font-family:var(--f);color:#fff;transition:border-color .18s,background .18s}
.summary-box.sw.on{background:#1C1C1C;border-color:var(--sel)}.summary-box.sw.on .bl{color:var(--sel)}
.noanim,.noanim *{animation:none!important}
.kick{display:flex;justify-content:space-between;align-items:center;background:#161616;border:1px solid #333;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;font-weight:800}
.kick.hot{border-color:#5A1E1E;color:var(--red)}
.sliphd{display:flex;align-items:center;gap:8px;margin-bottom:6px}.sliphd b{font-size:14.5px;font-weight:900}.sliphd span{font-size:12px;color:var(--dim);flex:1}
.rchip{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid #333;color:var(--dim);white-space:nowrap}
.rchip.won{color:var(--green);border-color:#1E5A34}.rchip.lost{color:var(--red);border-color:#5A1E1E}
.game{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #262626}.game:last-child{border:0}
.game .tm{width:50px;font-size:14px;font-weight:900;flex:none}.game .tm small{display:block;font-size:9.5px;color:var(--dim);font-weight:600;margin-top:2px}
.game .gm{flex:1;min-width:0}.game .gm b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.game .gm small{font-size:12px;color:var(--dim)}
.st{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.st.up{color:var(--mute);background:#1E1E1E}.st.live{color:#fff;background:#C8102E;animation:pulse 1.6s ease-in-out infinite}.st.ht{color:#1A1405;background:var(--yellow)}.st.end{color:var(--dim);background:#1E1E1E}
@keyframes pulse{50%{opacity:.6}}
.game .tk{display:flex;gap:5px}.game .tk button{width:36px;height:34px;border-radius:9px;background:#1E1E1E;border:1px solid #2A2A2A;font-size:14px;padding:0}
.game .tk button.on.w{border-color:var(--green);background:#0F2A1A}.game .tk button.on.x{border-color:var(--red);background:#2A0F0F}
.statrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #262626;font-size:13.5px}.statrow:last-child{border:0}.statrow b{font-weight:900;text-align:right}.statrow .muted{font-size:11px;font-weight:600}
.mini-cv{width:150px;aspect-ratio:9/16;border-radius:10px;border:1px solid #333;display:block;margin:0 auto 10px;background:#000}
.gedit{display:grid;grid-template-columns:96px 1fr;gap:6px;padding:8px 0;border-bottom:1px solid #262626}.gedit input{padding:8px 9px;font-size:13px}
.mini button{display:inline-flex;align-items:center}

.pill{font-size:10.5px;font-weight:900;letter-spacing:.5px;padding:4px 10px;border-radius:99px;white-space:nowrap;display:inline-block}
.pill.won{background:#0F3A22;color:#4BE27A}.pill.lost{background:#3A1212;color:#FF6B6B}.pill.live{background:#C8102E;color:#fff;animation:pulse 1.6s ease-in-out infinite}.pill.wait{background:#242424;color:var(--mute)}.pill.due{background:#3A2E0A;color:var(--yellow)}
.slipc{border-left-width:4px}.slipc.t10{border-left-color:var(--purple)}.slipc.t5{border-left-color:var(--orange)}.slipc.vip{border-left-color:var(--yellow)}
.sline{font-size:13px;color:#fff;margin:4px 0}.sline b{font-weight:900}.sline.dim{color:var(--dim);font-size:12.5px}
.res-btn{flex:1;padding:12px;border-radius:12px;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--mute);font-size:14px;font-weight:900}
.res-btn.w.on{background:#0F3A22;border-color:#30D158;color:#4BE27A}.res-btn.l.on{background:#3A1212;border-color:#FF453A;color:#FF6B6B}
.glist{margin-top:6px;border-top:1px solid #262626}.game.tag{cursor:pointer}
.trow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid #262626;padding:12px 0;text-align:left}.trow:last-child{border:0}
.trow .tn{flex:1;min-width:0}.trow .tn b{display:block;font-size:15px;font-weight:900}.trow .tn small{font-size:12px;color:var(--dim)}.trow .ch,.drow .ch,.hrow .ch{color:#555;font-size:20px}
.sect{font-size:10px;letter-spacing:2px;color:var(--dim);font-weight:800;margin:4px 4px 8px;text-transform:uppercase}
.sbox{background:#161616;border-radius:14px;padding:14px 6px 12px;border:1px solid #333;text-align:center;animation:cardIn .3s both;border-top-width:3px}
.sbox.p{border-top-color:var(--purple)}.sbox.o{border-top-color:var(--orange)}.sbox.y{border-top-color:var(--yellow)}
.sbox .bl{font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:700}
.sbox .big{font-size:26px;font-weight:900}.sbox.p .big{color:var(--purple)}.sbox.o .big{color:var(--orange)}.sbox.y .big{color:var(--yellow)}
.sbox .sm{font-size:11px;color:#fff;margin-top:4px;font-weight:600}.sbox .sm2{font-size:10.5px;color:var(--dim);margin-top:3px}
.streakrow{display:flex;justify-content:space-between;align-items:center}.streakrow b{font-size:30px;font-weight:900;color:var(--orange)}
.drow{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;border-bottom:1px solid #262626;padding:10px 0;text-align:left;opacity:.6}.drow:last-child{border:0}
.drow .dt{flex:1;font-size:13px;font-weight:700}.drow .dt small{display:block;font-size:11px;color:var(--dim);font-weight:600}
.wk{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px 8px}.wk span{font-size:10px;letter-spacing:2px;color:var(--dim);font-weight:800;text-transform:uppercase}.wk b{font-size:12px;color:var(--blue)}
.hrow .a{align-items:center}.dpills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.dpill{font-size:10.5px;font-weight:900;padding:4px 9px;border-radius:99px;background:#242424;color:var(--mute)}.dpill.won{background:#0F3A22;color:#4BE27A}.dpill.lost{background:#3A1212;color:#FF6B6B}
.bar{height:5px;border-radius:99px;background:#262626;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#BF5AF2,#8E3FBE);border-radius:99px}
.hrow .b{margin-top:5px}
.times{display:flex;align-items:center;gap:14px;background:#101010;border:1px solid #262626;border-radius:14px;padding:12px 16px;margin:8px 0}
.times div{display:flex;flex-direction:column}.times small{font-size:9.5px;letter-spacing:1.5px;color:var(--dim);font-weight:800}.times b{font-size:26px;font-weight:900;line-height:1.1}
.times .arr{color:#555;font-size:20px;flex:none}

<script>
(()=>{
'use strict';
const VERSION='v34';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(t,ms=2600){const el=$('toast');el.textContent=t;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms);}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ---------- Dates ----------
const pad=n=>String(n).padStart(2,'0');const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const todayKey=()=>keyOf(new Date());
const dateOf=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const longDate=k=>{const d=dateOf(k);return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;};
const shortDate=k=>{const d=dateOf(k);return `${DAYS[d.getDay()].slice(0,3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;};
const addDays=(k,n)=>{const d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d);};const addMonths=(k,n)=>{const d=dateOf(k);const day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return keyOf(d);};
const daysBetween=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);

// ---------- Unicode styles ----------
function bold(s){return [...String(s)].map(ch=>{const c=ch.codePointAt(0);if(c>=65&&c<=90)return String.fromCodePoint(0x1D5D4+c-65);if(c>=97&&c<=122)return String.fromCodePoint(0x1D5EE+c-97);if(c>=48&&c<=57)return String.fromCodePoint(0x1D7EC+c-48);return ch;}).join('');}
function ital(s){return [...String(s)].map(ch=>{const c=ch.codePointAt(0);if(c>=65&&c<=90)return String.fromCodePoint(0x1D608+c-65);if(c>=97&&c<=122)return String.fromCodePoint(0x1D622+c-97);return ch;}).join('');}
function styleText(s){return s.replace(/\*\*(.+?)\*\*/g,(_,t)=>bold(t)).replace(/(^|[\s(])_([^_\n]+?)_(?=$|[\s).,!?])/gm,(_,a,t)=>a+ital(t));}
const rnd=o=>Math.round(Number(o)||0);
const AGE_RE=/^[ \t]*18\+\s*\|\s*(Bet|Gamble) Responsibly[ \t]*$/gim;
const stripAge=t=>String(t||'').replace(AGE_RE,'').replace(/\n{3,}/g,'\n\n').replace(/\s+$/,'');

// ---------- Storage (this app only) ----------
const DBN='SS707_Hub',ST='kv';let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onversionchange=()=>{r.result.close();dbp=null;};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return dbp;}
async function kget(k){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function kset(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function kdel(k){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}

  if(nested && $('sub').classList.contains('open')){

    const page={title,render};
    subPages.push(page);subRender=render;$('subTitle').textContent=title;$('sub').scrollTop=0;render();

      // Always restore the page that was visible immediately before this nested page.
      const idx=subPages.lastIndexOf(page);
      if(idx>=0)subPages.splice(idx,1);
      const p=parent||subPages[subPages.length-1];

async function wikiCrest(name,kind='club'){const search=kind==='international'?name+' national football team':name+' football club';const q=`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${enc(search)}&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=320&pilicense=any`;
  try{const r=await fetch(q);if(!r.ok)return null;const j=await r.json();const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0));const pg=pages.find(p=>p.thumbnail&&p.thumbnail.source);if(!pg)return null;
    const ir=await fetch(pg.thumbnail.source);if(!ir.ok)return null;const b=await ir.blob();if(!b.size||!/image/.test(b.type))return null;
    return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b);});}catch(e){return null;}}
const haveCrest=name=>S.crestList.some(x=>crestNames(x).includes(cleanName(name)));
async function saveOnline(name,lg,kind='club'){if(haveCrest(name))return 'have';const du=await wikiCrest(name,kind);if(!du)return 'fail';try{const raw=await normaliseCrest(du);const r=await cutBackground(raw,true);await addCrest(r.src,name,lg||'');return 'ok';}catch(e){return 'fail';}}
async function fetchMany(names,lg,after,kind='club'){const L=[...new Set(names.map(n=>n.trim()).filter(Boolean))];if(!L.length)return;if(!navigator.onLine){toast('You are offline. Connect to the internet and try again.',3500);return;}
  let ok=0,have=0;const bad=[];for(let i=0;i<L.length;i++){toast(`Getting crests: ${i+1} of ${L.length}`,2500);const r=await saveOnline(L[i],lg,kind);if(r==='ok')ok++;else if(r==='have')have++;else bad.push(L[i]);}
  await autoFillCrests();if(after)after();resultSheet(ok,have,bad,lg,after);}
function resultSheet(ok,have,bad,lg,after){
  openSheet(`<div class="modal-title">Crests done</div><div class="statrow"><span>Added</span><b style="color:var(--green)">${ok}</b></div><div class="statrow"><span>Already saved</span><b>${have}</b></div><div class="statrow"><span>Need saving by hand</span><b style="color:${bad.length?'var(--red)':'#fff'}">${bad.length}</b></div>
    ${bad.length?`<p class="muted" style="margin:10px 0 6px">For each one: tap Find picture, long-press a crest and download it, then tap Add picture.</p>${bad.map(n=>`<div class="statrow" data-n="${esc(n)}"><span>${esc(n)}</span><span style="display:flex;gap:6px"><button class="btn-half" data-a="find" style="padding:7px 10px">Find picture</button><button class="btn-half green" data-a="add" style="padding:7px 10px">Add picture</button></span></div>`).join('')}`:''}
    <div class="btn-row"><button class="btn-save green" data-a="close">Done</button></div>`,
  e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(a==='close'){closeSheet();return;}const n=b.closest('[data-n]').dataset.n;
    if(a==='find'){window.open(`https://www.google.com/search?tbm=isch&q=${enc(n+' football club logo png')}`,'_blank');return;}
    if(a==='add'){pickFile('image/*',false,async fs=>{if(!fs[0])return;const raw=await normaliseCrest(await fileToDataURL(fs[0]));const r=await cutBackground(raw,true);await addCrest(r.src,n,lg||'');b.closest('[data-n]').remove();toast(`${n} saved ✓`);await autoFillCrests();if(after)after();});}});}

async function findOnline(name){if(!navigator.onLine)return null;const r=await saveOnline(name.trim(),'');if(r==='ok'||r==='have'){const id=findCrestId(name);return id?await crestSrc(id):null;}return null;}
let onlineBusy=false;
async function onlineFill(){if(onlineBusy||!navigator.onLine)return;onlineBusy=true;let n=0;try{for(const r of S.vrows){for(const [f,k] of [['home','hc'],['away','ac']]){if(!r[k]&&r[f]&&r[f].trim()){const src=await findOnline(r[f]);if(src){r[k]=src;n++;}}}}}finally{onlineBusy=false;}
  if(n){save('vrows');renderRows();redraw();toast(`Found ${n} crest${n>1?'s':''} online ✓`);}}

function nameManySheet(files,lg0,after){const items=[];(async()=>{for(const f of files){try{const raw=await normaliseCrest(await fileToDataURL(f));const r=await cutBackground(raw,true);items.push({src:r.src,name:titleCase(cleanName(f.name)),al:'',lg:lg0||''});}catch(e){}}
  const render=()=>{$('sheetBox').innerHTML=`<div class="modal-title">Name your crests (${items.length})</div><p class="muted" style="margin-bottom:10px">Screenshot this and send it to Claude for a #CRESTS block, then paste it below. Or type the names yourself.</p>
    <div class="nmgrid">${items.map((it,i)=>`<div class="nm" data-i="${i}"><div class="nmimg"><img src="${it.src}" alt=""><b>${i+1}</b></div><input data-f="name" value="${esc(it.name)}" placeholder="Team name"></div>`).join('')}</div>
    <span class="lbl">Paste #CRESTS block</span><textarea id="nmPaste" rows="4" placeholder="#CRESTS&#10;1 | Arsenal | Gunners | Premier League"></textarea><button class="btn-half purple w100" data-a="apply" style="margin-top:8px">Apply names</button>
    <div class="btn-row"><button class="btn-half" data-a="no">Cancel</button><button class="btn-save" data-a="save">Save all</button></div>`;};
  openSheet('',async e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
    if(a==='apply'){let n=0;$('nmPaste').value.split('\n').forEach(l=>{const m=l.trim().match(/^(\d+)\s*[|.)-]\s*([^|]+?)\s*(?:\|\s*([^|]*?)\s*)?(?:\|\s*(.*?)\s*)?$/);if(!m)return;const it=items[Number(m[1])-1];if(!it)return;it.name=m[2].trim();it.al=(m[3]||'').trim();if(m[4])it.lg=m[4].trim();n++;});toast(n?`${n} names applied ✓`:'No numbered lines found');render();return;}
    if(a==='save'){let ok=0,dup=0;for(const it of items){if(!it.name.trim())continue;if(haveCrest(it.name)){dup++;continue;}const id=await addCrest(it.src,it.name.trim(),it.lg);const c=S.crestList.find(x=>x.id===id);c.aliases=it.al.split(',').map(x=>x.trim()).filter(Boolean);ok++;}
      save('crestList');closeSheet();toast(`${ok} crest${ok===1?'':'s'} saved ✓${dup?` ${dup} already in the library`:''}`,3500);await autoFillCrests();if(after)after();return;}
    if(a==='no')closeSheet();});
  $('sheetBox').oninput=e=>{const t=e.target;if(t.dataset.f==='name'){items[Number(t.closest('[data-i]').dataset.i)].name=t.value;}};render();})();}

function openMorning(){
  const bindList=()=>{$('subBody').onclick=e=>{const b=e.target.closest('[data-wd]');if(b)openFolder(Number(b.dataset.wd));};};
  const render=async()=>{const t=new Date().getDay();
    $('subBody').innerHTML=`<p class="muted" style="margin-bottom:12px">Add ready-made images to each day. Every morning the app checks today's weekday and randomly picks one image from that day's folder, then pairs it directly with the morning greeting.</p>
      <div class="set-list">${await Promise.all(WEEK.map(async wd=>{const L=S.imgIndex[wd]||[];const th=L[0]?await cget('img:'+L[0].id):null;

function openFolder(wd){const render=async()=>{const L=S.imgIndex[wd]||[];$('subTitle').textContent=`${DAYS[wd]} (${L.length})`;const srcs=await Promise.all(L.map(x=>cget('img:'+x.id)));
    $('subBody').innerHTML=`<button class="btn-save w100" id="fAdd" style="margin-bottom:12px">+ Add images</button>${L.length?`<div class="igrid">${L.map((x,i)=>`<button data-iid="${x.id}"><img src="${srcs[i]}" alt=""><span class="u">${x.used?`Used ${shortDate(keyOf(new Date(x.used)))}`:'New'}</span></button>`).join('')}</div>`:'<p class="empty">No images yet. Select as many as you like at once.</p>'}`;};
  openSub(DAYS[wd],render,true);
  $('subBody').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='fAdd'){pickFile('image/*',true,async fs=>{if(!fs.length)return;let n=0;for(const f of fs){try{toast(`Adding ${n+1} of ${fs.length}...`,1500);const u=await shrink(await fileToDataURL(f),1440,'image/jpeg',0.88);const id=uid();await cset('img:'+id,u);S.imgIndex[wd].push({id,used:0});n++;}catch(err){}}
      save('imgIndex');toast(`${n} image${n===1?'':'s'} added to ${DAYS[wd]} ✓`);render();});return;}
    if(b.dataset.iid){const id=b.dataset.iid;const isToday=wd===new Date().getDay();
      openSheet(`<div class="modal-title">Image</div><img class="mimg" src="${await cget('img:'+id)}" alt=""><div class="btn-row">${isToday?'<button class="btn-save" data-a="use">Use today</button>':''}<button class="btn-half red" data-a="del">Delete</button><button class="btn-half" data-a="no">Close</button></div>`,
        async ev=>{const bb=ev.target.closest('button');if(!bb)return;if(bb.dataset.a==='use'){const d=day(todayKey());d.morningImg=id;save('days');closeSheet();toast('Set as today\'s morning image ✓');}
          else if(bb.dataset.a==='del'){S.imgIndex[wd]=S.imgIndex[wd].filter(x=>x.id!==id);await cdel('img:'+id);Object.values(S.days).forEach(d=>{if(d.morningImg===id)d.morningImg=null;});save('imgIndex');save('days');closeSheet();toast('Image deleted');render();}else closeSheet();});}};}

    let i=find('mvhd');if(i<0)return blob;const v=head[i+4];const ts=v===1?dv.getUint32(i+24):dv.getUint32(i+16);const dur=Math.round(ms*ts/1000);
    if(v===1){dv.setUint32(i+28,Math.floor(dur/4294967296));dv.setUint32(i+32,dur>>>0);}else dv.setUint32(i+20,dur>>>0);
    let j=0;while((j=find('tkhd',j+1))>0){const tv=head[j+4];if(tv===1){dv.setUint32(j+28,Math.floor(dur/4294967296));dv.setUint32(j+32,dur>>>0);}else dv.setUint32(j+24,dur>>>0);}
    j=0;while((j=find('mdhd',j+1))>0){const mv=head[j+4];const mts=mv===1?dv.getUint32(j+24):dv.getUint32(j+16);const md=Math.round(ms*mts/1000);if(mv===1){dv.setUint32(j+28,Math.floor(md/4294967296));dv.setUint32(j+32,md>>>0);}else dv.setUint32(j+20,md>>>0);}
    const k=find('mehd');if(k>0){const ev=head[k+4];if(ev===1){dv.setUint32(k+8,Math.floor(dur/4294967296));dv.setUint32(k+12,dur>>>0);}else dv.setUint32(k+8,dur>>>0);}
    return new Blob([head,rest],{type:blob.type});}
  const vint=p=>{const b=head[p];let len=1,mask=0x80;while(len<=8&&!(b&mask)){mask>>=1;len++;}if(len>8)return null;let v=b&(mask-1);for(let x=1;x<len;x++)v=v*256+head[p+x];return {len,v};};
  const eid=p=>{const b=head[p];let len=1,mask=0x80;while(len<=4&&!(b&mask)){mask>>=1;len++;}let v=0;for(let x=0;x<len;x++)v=v*256+head[p+x];return {len,v};};
  let p=-1;for(let x=0;x<head.length-4;x++){if(head[x]===0x15&&head[x+1]===0x49&&head[x+2]===0xA9&&head[x+3]===0x66){p=x;break;}}if(p<0)return blob;
  const sz=vint(p+4);if(!sz)return blob;const ds=p+4+sz.len,de=ds+sz.v;if(de>head.length)return blob;
  let q=ds;while(q<de){const id=eid(q);const s=vint(q+id.len);if(!s)break;if(id.v===0x4489){const vs=q+id.len+s.len;if(s.v===8)dv.setFloat64(vs,ms);else if(s.v===4)dv.setFloat32(vs,ms);return new Blob([head,rest],{type:blob.type});}q+=id.len+s.len+s.v;}
  const dur=new Uint8Array(11);dur[0]=0x44;dur[1]=0x89;dur[2]=0x88;new DataView(dur.buffer).setFloat64(3,ms);
  const ns=new Uint8Array(8);ns[0]=0x01;let n=sz.v+11;for(let x=7;x>=1;x--){ns[x]=n%256;n=Math.floor(n/256);}
  return new Blob([head.slice(0,p+4),ns,head.slice(ds,de),dur,head.slice(de),rest],{type:blob.type});}catch(e){return blob;}}

// ---------- Video history ----------
const KEEP_VIDS=30;let vFilter='all';
async function saveVideo(blob,ext,tl,thumb){const id=uid();const tname=(S.vtpls.find(t=>t.id===S.vset.tpl)||{name:'Navy'}).name;
  S.vhist.unshift({id,at:Date.now(),matches:tl.segs.filter(g=>g.k==='m').length,secs:Math.round(tl.total),tpl:tname,ext,size:blob.size,thumb,file:true,videoSlot,videoDate:videoDateKey});
  try{await kset('vid:'+id,blob);}catch(e){S.vhist[0].file=false;}
  for(const v of S.vhist.slice(KEEP_VIDS))if(v.file){v.file=false;try{await kdel('vid:'+v.id);}catch(e){}}
  save('vhist');renderVHist();}
function renderVHist(){const el=$('vhist');if(!el)return;const all=S.vhist||[];const L=vFilter==='not'?all.filter(v=>!v.posted):all;const np=all.filter(v=>!v.posted).length;
  el.innerHTML=`<div class="sechd" style="margin:0 0 6px"><div class="ct" style="margin:0">Recorded videos</div>${all.length?`<div class="seg2"><button data-vf="all" class="${vFilter==='all'?'on':''}">All</button><button data-vf="not" class="${vFilter==='not'?'on':''}">Not posted${np?` (${np})`:''}</button></div>`:''}</div>
  ${L.length?L.slice(0,40).map(v=>{const d=new Date(v.at);return `<button class="vrow" data-vid="${v.id}">${v.thumb?`<img src="${v.thumb}" alt="">`:'<span class="vph">🎬</span>'}<span class="vt">${shortDate(keyOf(d))} · ${fmtT(d)}<small>${v.matches} match${v.matches===1?'':'es'} · ${v.secs}s · ${esc(v.tpl)}${v.videoSlot?` · ${v.videoSlot==='v1'?'Video 1':'Video 2'}`:''}${v.file?'':' · record only'}</small></span>${v.posted?'<span class="pill won">POSTED</span>':'<span class="pill wait">NOT POSTED</span>'}</button>`;}).join('')
    :`<p class="muted" style="margin-top:4px">${all.length?'Everything is posted ✓':'Videos you record show up here.'}</p>`}`;}
$('vhist').addEventListener('click',async e=>{const fb=e.target.closest('[data-vf]');if(fb){vFilter=fb.dataset.vf;renderVHist();return;}const b=e.target.closest('[data-vid]');if(!b)return;const v=S.vhist.find(x=>x.id===b.dataset.vid);if(!v)return;
  const d=new Date(v.at);const name=`SureStake707_Scores_${keyOf(d)}.${v.ext}`;let blob=v.file?await kget('vid:'+v.id):null;const url=blob?URL.createObjectURL(blob):null;
  openSheet(`<div class="modal-title">${shortDate(keyOf(d))} · ${fmtT(d)}</div>${url?`<video class="res-v" src="${url}" controls playsinline></video>`:'<p class="muted" style="margin-bottom:10px">Only the record is kept for this one. The video file was cleared to save space (the app keeps your last 10).</p>'}
    <p class="muted" style="text-align:center;margin-bottom:10px">${v.matches} match${v.matches===1?'':'es'} · ${v.secs}s · ${esc(v.tpl)}</p>
    <div class="btn-row">${url?'<button class="btn-save orange" data-a="save">Save video</button><button class="btn-half orange" data-a="share">Share</button>':''}</div>
    <div class="btn-row"><button class="btn-half ${v.posted?'':'green'}" data-a="post">${v.posted?'Mark as not posted':'✓ Mark as posted'}</button></div><div class="btn-row"><button class="btn-half red" data-a="del">Delete</button><button class="btn-half" data-a="close">Close</button></div>`,
  async ev=>{const bb=ev.target.closest('button');if(!bb)return;const a=bb.dataset.a;
    if(a==='save'){const x=document.createElement('a');x.href=url;x.download=name;document.body.appendChild(x);x.click();x.remove();toast('Video saved to Downloads ✓');}
    else if(a==='share'){await shareVideoFile(blob,name);}
    else if(a==='post'){v.posted=!v.posted;save('vhist');closeSheet();renderVHist();toast(v.posted?'Marked as posted ✓':'Marked as not posted');}
    else if(a==='del'){if(!confirm('Delete this video?'))return;S.vhist=S.vhist.filter(x=>x!==v);try{await kdel('vid:'+v.id);}catch(err){}save('vhist');closeSheet();renderVHist();toast('Video deleted');}
    else if(a==='close')closeSheet();},()=>{if(url)URL.revokeObjectURL(url);});});



// ---------- Tabs ----------
let tab='home';
function renderHeader(){const l=$('hLogo');if(S.logo){l.innerHTML=`<img src="${S.logo}" alt="">`;l.hidden=false;}else{l.innerHTML='';l.hidden=true;}$('hDate').textContent=longDate(todayKey());}
function refresh(){renderHeader();if(tab==='home')renderHome();else if(tab==='history')renderHistory();else if(tab==='elite')renderElite();else if(tab==='settings')renderSettings();}
function showTab(t){tab=t;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='p-'+t));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  if(playing&&t!=='video'){stopRun();$('btnPlay').textContent='▶ Preview';}if(t==='video'){activateVideoDay(todayKey());}refresh();if(t==='video')redraw();window.scrollTo(0,0);}
document.querySelector('.bottom-nav').onclick=e=>{const b=e.target.closest('.nav-btn');if(b)showTab(b.dataset.tab);};

// ---------- Start ----------
async function loadAll(){const all=await kallState();const B=blankState();
  S.days=all.days||{};S.crestList=all.crestList||[];S.vrows=Array.isArray(all.vrows)&&all.vrows.length?all.vrows.map(r=>({...newRow(),...r})):[];S.videoDays=all.videoDays||{};
  S.vset={...DEF_VIDEO,...(all.vset||{})};if(S.vset.trans&&!(all.vset||{}).crestAnim)S.vset.crestAnim=S.vset.trans;delete S.vset.trans;
  S.vtpls=all.vtpls||B.vtpls;S.vtpls.forEach(t=>{if(t.id==='navy'&&t.name==='Navy')t.name='Blue';});S.vhist=all.vhist||[];S.logo=all.logo||null;S.members=all.members||[];S.followers=all.followers||[];S.prefs={...B.prefs,...(all.prefs||{})};S.imgIndex={...B.imgIndex,...(all.imgIndex||{})};S.finance={...B.finance,...(all.finance||{}),saved:Array.isArray(all.finance?.saved)?all.finance.saved:[],withdrawn:Array.isArray(all.finance?.withdrawn)?all.finance.withdrawn:[],otherIncome:Array.isArray(all.finance?.otherIncome)?all.finance.otherIncome:[],hide:!!(all.finance?.hide)};
  if(!all.migrated){const old=await readOld();if(old){if(old.crests&&!all.crests)all.crests=old.crests;if(!S.vrows.length&&Array.isArray(old.rows))S.vrows=old.rows.map(r=>({...newRow(),...r}));if(old.settings)S.vset={...S.vset,...old.settings};if(old.customTpl&&!all.customTpl)all.customTpl=old.customTpl;}await kset('migrated',true);}
  if(!all.migrated2){ // v1 -> v2 storage
    if(all.crests&&typeof all.crests==='object'){for(const [k,src] of Object.entries(all.crests)){if(!src)continue;const id=uid();S.crestList.push({id,name:titleCase(k),aliases:[],league:''});await kset('crest:'+id,src);}await kdel('crests');}
    if(all.customTpl){const id=uid();await kset('tpl:'+id,all.customTpl);S.vtpls.push({id,name:'My own'});if(S.vset.tpl==='custom')S.vset.tpl=id;await kdel('customTpl');}
    for(const d of Object.values(S.days))for(const k in d.posts||{})d.posts[k]=stripAge(d.posts[k]);
    for(const k of ['crestList','vtpls','vset','days'])await kset(k,S[k]);await kset('migrated2',true);}
  for(const d of Object.values(S.days)){if((d.vipPicks||[]).length&&!(d.games||[]).some(g=>g.slot==='vip')){d.games=d.games||[];d.vipPicks.forEach(p=>{const i=p.text.lastIndexOf(' - ');d.games.push({id:uid(),slot:'vip',time:'',match:i>0?p.text.slice(0,i):p.text,pick:i>0?p.text.slice(i+3):'',res:p.res||null});});d.vipPicks=[];save('days');}}
  if(!Object.keys(S.videoDays).length&&S.vrows.length){const built=buildVideoRowsForDay(todayKey());S.videoDays[todayKey()]={v1:built.v1,v2:built.v2,active:'v1',seeded:true};await kset('videoDays',S.videoDays);}
  if(!S.vtpls.some(t=>t.id===S.vset.tpl))S.vset.tpl='navy';if(!S.vrows.length)S.vrows=[];curId=S.vrows[0]?.id||null;LY=null;tplLoaded=null;}
(async()=>{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});let loaded=false;const loadPromise=loadAll();const busyTimer=setTimeout(()=>{if(!loaded){renderHeader();showTab('home');toast('Storage is busy. Close other copies of Sure Stake and reopen.',5000);}},6000);try{await loadPromise;loaded=true;clearTimeout(busyTimer);}catch(e){loaded=true;clearTimeout(busyTimer);toast('Storage is not available. Nothing will be kept.',4000);if(!S.vrows.length)S.vrows=[newRow()];}
  renderHeader();showTab('home');
  try{await cget('eliteFlyer');}catch(e){}renderVideoUI();await preloadAll();drawStill();document.fonts&&document.fonts.ready.then(()=>{if(!playing)drawStill();});})();
})();
